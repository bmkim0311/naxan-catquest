<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Nexan Games - 친구 메시지</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .chat-container {
            max-width: 900px;
            height: 82vh;
            margin: 10px auto;
            background: #1e1e1e;
            border: 1px solid #00ff66;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #333;
            background: #202020;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .chat-title {
            margin: 0;
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .target-name {
            color: #00ff66;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 16px;
            background: #333;
            border: 1px solid #00ff66;
            color: #00ff66;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-back:hover {
            background: #00ff66;
            color: #000;
        }

        .chat-messages {
            flex: 1;
            padding: 22px;
            overflow-y: auto;
            background: #181818;
            box-sizing: border-box;
        }

        .empty-chat {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
            line-height: 1.7;
            text-align: center;
        }

        .msg-row {
            width: 100%;
            display: flex;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .msg-row.me {
            justify-content: flex-end;
        }

        .msg-row.other {
            justify-content: flex-start;
        }

        .msg-pack {
            display: flex;
            flex-direction: column;
            flex: 0 0 auto;
            width: auto;
            max-width: 78%;
            box-sizing: border-box;
        }

        .msg-row.me .msg-pack {
            align-items: flex-end;
        }

        .msg-row.other .msg-pack {
            align-items: flex-start;
        }

        .msg-sender {
            font-size: 0.78rem;
            font-weight: bold;
            color: #aaa;
            margin: 0 0 5px 6px;
            text-align: left;
        }

        .msg-line {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            width: auto;
            max-width: 100%;
        }

        .msg-row.me .msg-line {
            justify-content: flex-end;
        }

        .msg-row.other .msg-line {
            justify-content: flex-start;
        }

        .msg-bubble {
            display: inline-block;
            width: fit-content;
            max-width: 420px;
            min-width: 0;
            height: auto;
            min-height: 0;
            padding: 8px 12px;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: left;
            line-height: 1.45;
            white-space: pre-line;
            word-break: break-word;
            overflow-wrap: anywhere;
            font-size: 1rem;
        }

        .msg-row.me .msg-bubble {
            background: #82f46f;
            color: #000;
            border-bottom-right-radius: 3px;
            order: 2;
        }

        .msg-row.other .msg-bubble {
            background: #2b2b2b;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            border-bottom-left-radius: 3px;
            order: 1;
        }

        .msg-time {
            flex: 0 0 auto;
            font-size: 0.68rem;
            color: #777;
            line-height: 1.2;
            white-space: nowrap;
            margin-bottom: 2px;
        }

        .msg-row.me .msg-time {
            order: 1;
        }

        .msg-row.other .msg-time {
            order: 2;
        }

        .link-preview-card {
            margin-top: 8px;
            width: 420px;
            max-width: 100%;
            background: #242428;
            border: 1px solid #3d3d45;
            border-radius: 10px;
            overflow: hidden;
            box-sizing: border-box;
            text-align: left;
            cursor: pointer;
        }

        .msg-row.me .link-preview-card {
            align-self: flex-end;
        }

        .msg-row.other .link-preview-card {
            align-self: flex-start;
        }

        .link-preview-body {
            padding: 12px 14px;
        }

        .link-preview-site {
            color: #bdbdbd;
            font-size: 0.78rem;
            margin-bottom: 7px;
        }

        .link-preview-title {
            color: #79a7ff;
            font-size: 1rem;
            font-weight: 800;
            line-height: 1.35;
            margin-bottom: 7px;
        }

        .link-preview-desc {
            color: #e0e0e0;
            font-size: 0.88rem;
            line-height: 1.45;
            margin-bottom: 8px;
        }

        .link-preview-url {
            color: #8a8a8a;
            font-size: 0.75rem;
            word-break: break-all;
        }

        .link-preview-raw {
            margin: 10px 14px 14px 14px;
            padding: 12px;
            max-height: 280px;
            overflow-y: auto;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #d8ffd8;
            font-family: Consolas, Monaco, monospace;
            font-size: 0.82rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .msg-row.me .link-preview-raw {
            background: #f3fff0;
            color: #111;
            border: 1px solid #9dea8d;
        }

        .link-preview-image {
            width: 100%;
            max-height: 230px;
            object-fit: cover;
            display: block;
            background: #111;
            border-top: 1px solid #333;
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #333;
            background: #202020;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            box-sizing: border-box;
        }

        .message-input {
            flex: 1;
            min-height: 48px;
            max-height: 120px;
            resize: none;
            padding: 12px 14px;
            background: #121212;
            border: 1px solid #555;
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.4;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        .message-input:focus {
            outline: none;
            border-color: #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.15);
        }

        .btn-send {
            min-width: 90px;
            height: 48px;
            padding: 0 18px;
            background: #82f46f;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-send:hover {
            background: #6ee85b;
        }

        .btn-send:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        .input-hint {
            color: #777;
            font-size: 0.8rem;
            text-align: left;
            padding: 0 16px 12px 16px;
            background: #202020;
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 86vh;
            }

            .msg-pack {
                max-width: 88%;
            }

            .msg-bubble {
                max-width: 300px;
            }

            .link-preview-card {
                width: 320px;
            }

            .link-preview-image {
                max-height: 180px;
            }

            .chat-header {
                align-items: flex-start;
            }

            .chat-input-area {
                gap: 8px;
            }

            .btn-send {
                min-width: 72px;
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1 class="chat-title">
                💬 <span class="target-name">{{ target }}</span> 님과의 대화
            </h1>

            <a href="/friends?tab=message" class="btn-back">
                ← 친구 메시지 목록
            </a>
        </div>

        <div id="chat-messages" class="chat-messages">
            <div class="empty-chat">
                메시지를 불러오는 중입니다...
            </div>
        </div>

        <div class="chat-input-area">
            <textarea
                id="message-input"
                class="message-input"
                placeholder="메시지를 입력하세요"
                autocomplete="off"
            ></textarea>

            <button id="send-button" class="btn-send" onclick="sendMessage()">
                전송
            </button>
        </div>

        <div class="input-hint">
            Enter: 전송 / Shift + Enter: 줄바꿈
        </div>
    </div>

    <script>
        const targetUser = "{{ target }}";
        let lastMessageCount = 0;
        let isSending = false;

        document.addEventListener('DOMContentLoaded', function() {
            loadMessages();
            setInterval(loadMessages, 2000);

            const input = document.getElementById('message-input');
            input.focus();

            input.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text || '';
            return div.innerHTML;
        }

        function formatTime(datetimeText) {
            if (!datetimeText) {
                return '';
            }

            const parts = datetimeText.split(' ');

            if (parts.length < 2) {
                return datetimeText;
            }

            const timeParts = parts[1].split(':');

            if (timeParts.length < 2) {
                return datetimeText;
            }

            return timeParts[0] + ':' + timeParts[1];
        }

        function parsePreview(previewText) {
            if (!previewText) {
                return null;
            }

            try {
                return JSON.parse(previewText);
            } catch (e) {
                return {
                    site_name: '링크 미리보기',
                    title: '미리보기 정보를 표시할 수 없습니다.',
                    description: previewText,
                    url: '',
                    image: ''
                };
            }
        }

        function makePreviewHtml(previewText) {
            const preview = parsePreview(previewText);

            if (!preview) {
                return '';
            }

            const siteName = escapeHtml(preview.site_name || '링크');
            const title = escapeHtml(preview.title || '제목 없음');
            const description = escapeHtml(preview.description || '');
            const url = escapeHtml(preview.url || '');
        
            const image = preview.image || '';
            const rawOutput = preview.raw_output || '';

            const imageHtml = image
                ? `<img class="link-preview-image" src="${escapeHtml(image)}" alt="preview image" onerror="this.style.display='none';">`
                : '';

            const rawOutputHtml = rawOutput
                ? `<pre class="link-preview-raw">${escapeHtml(rawOutput)}</pre>`
                : '';

            return `
                <div class="link-preview-card">
                    <div class="link-preview-body" onclick="openPreviewUrl('${encodeURIComponent(preview.url || '')}')">
                        <div class="link-preview-site">${siteName}</div>
                        <div class="link-preview-title">${title}</div>
                        <div class="link-preview-desc">${description}</div>
                        <div class="link-preview-url">${url}</div>
                    </div>
                    ${imageHtml}
                    ${rawOutputHtml}
                </div>
            `;

	}

        function openPreviewUrl(encodedUrl) {
            const url = decodeURIComponent(encodedUrl || '');

            if (!url) {
                return;
            }

            window.open(url, '_blank');
        }

        function loadMessages() {
            fetch('/api/get_messages?target=' + encodeURIComponent(targetUser))
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                const messageBox = document.getElementById('chat-messages');

                if (!data.success) {
                    messageBox.innerHTML = `
                        <div class="empty-chat">
                            메시지를 불러오지 못했습니다.<br>
                            ${escapeHtml(data.message || '')}
                        </div>
                    `;
                    return;
                }

                if (!data.messages || data.messages.length === 0) {
                    messageBox.innerHTML = `
                        <div class="empty-chat">
                            아직 대화가 없습니다.<br>
                            첫 메시지를 보내보세요.
                        </div>
                    `;
                    lastMessageCount = 0;
                    return;
                }

                let html = '';

                data.messages.forEach(function(msg) {
                    const isMe = Number(msg.is_me) === 1;
                    const rowClass = isMe ? 'me' : 'other';

                    const senderHtml = isMe
                        ? ''
                        : `<div class="msg-sender">${escapeHtml(msg.sender_name)}</div>`;

                    const previewHtml = makePreviewHtml(msg.preview_result);

                    html += `
                        <div class="msg-row ${rowClass}">
                            <div class="msg-pack">
                                ${senderHtml}

                                <div class="msg-line">
                                    <div class="msg-time">${escapeHtml(formatTime(msg.created_at || ''))}</div>
                                    <div class="msg-bubble">${escapeHtml(msg.content)}</div>
                                </div>

                                ${previewHtml}
                            </div>
                        </div>
                    `;
                });

                messageBox.innerHTML = html;

                if (data.messages.length !== lastMessageCount) {
                    messageBox.scrollTop = messageBox.scrollHeight;
                    lastMessageCount = data.messages.length;
                }
            })
            .catch(function(err) {
                console.error("메시지 조회 오류:", err);
            });
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const content = input.value.trim();

            if (!content) {
                input.focus();
                return;
            }

            if (isSending) {
                return;
            }

            isSending = true;
            sendButton.disabled = true;
            sendButton.innerText = '전송중';

            fetch('/api/send_message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    target: targetUser,
                    content: content
                })
            })
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                if (!data.success) {
                    alert(data.message || "메시지 전송에 실패했습니다.");
                    return;
                }

                input.value = '';
                loadMessages();
                input.focus();
            })
            .catch(function(err) {
                console.error("메시지 전송 오류:", err);
                alert("메시지 전송 중 오류가 발생했습니다.");
            })
            .finally(function() {
                isSending = false;
                sendButton.disabled = false;
                sendButton.innerText = '전송';
            });
        }
    </script>
</body>
</html>
