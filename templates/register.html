<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Nexan Games - 회원가입</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 440px;
            border: 1px solid #ff9900;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: #ff9900;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .section-title {
            text-align: left;
            color: #ff9900;
            font-weight: bold;
            font-size: 0.95em;
            margin: 28px 0 14px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9em;
        }

        .required {
            color: #ff4444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            box-sizing: border-box;
            font-size: 1em;
        }

        input:focus {
            border-color: #ff9900;
            outline: none;
        }

        .notice-box {
            background: #2a2418;
            border: 1px solid #7a5200;
            color: #ffd89a;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.82em;
            line-height: 1.5;
            text-align: left;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ff9900;
            border: none;
            border-radius: 5px;
            color: #000;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #e08800;
        }

        .link {
            margin-top: 20px;
            font-size: 0.9em;
        }

        .link a {
            color: #ff9900;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .container {
                width: 100%;
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>NEXAN JOIN</h2>

        <div class="subtitle">
            Cat Quest 이용을 위해 계정 정보와 개인정보를 입력하세요.
        </div>

        <form action="/register" method="POST">
            <div class="section-title">계정 정보</div>

            <div class="input-group">
                <label for="username">
                    계정 아이디 <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    placeholder="아이디를 입력하세요"
                >
            </div>

            <div class="input-group">
                <label for="password">
                    비밀번호 <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="비밀번호를 입력하세요"
                >
            </div>

            <div class="section-title">개인정보</div>

            <div class="notice-box">
                개인정보는 게임 DB가 아닌 별도 개인정보 DB 서버에 저장됩니다.
            </div>

            <div class="input-group">
                <label for="real_name">
                    이름 <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="real_name"
                    name="real_name"
                    required
                    placeholder="이름을 입력하세요"
                >
            </div>

            <div class="input-group">
                <label for="email">
                    이메일 <span class="required">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="example@nexan.com"
                >
            </div>

            <div class="input-group">
                <label for="phone">
                    전화번호 <span class="required">*</span>
                </label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    placeholder="010-1234-5678"
                >
            </div>

            <div class="input-group">
                <label for="birth_date">
                    생년월일 <span class="required">*</span>
                </label>
                <input
                    type="date"
                    id="birth_date"
                    name="birth_date"
                    required
                >
            </div>

            <div class="input-group">
                <label for="address">
                    주소 <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    required
                    placeholder="주소를 입력하세요"
                >
            </div>

            <button type="submit" class="btn">
                가입 신청
            </button>
        </form>

        <div class="link">
            이미 계정이 있으신가요? <a href="/login">로그인하기</a>
        </div>
    </div>
</body>
</html>
