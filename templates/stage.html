<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Nexan Games - 스테이지 {{ stage_num }}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; text-align: center; }
        .game-container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #ff9900; }
        
        /* 대시보드 스타일 */
        .status-bar { display: flex; justify-content: space-between; background: #2d2d2d; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        .timer { font-size: 1.2em; color: #ff3333; }

        /* 기획안 6번: 5x5 격자무늬 맵 레이아웃 */
        .grid-map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 350px; margin: 20px auto; }
        .tile { width: 60px; height: 60px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; font-size: 1.8em; display: flex; justify-content: center; align-items: center; user-select: none; }
        .tile.current { background: #44331a; border-color: #ff9900; box-shadow: 0 0 10px #ff9900; }

        /* 컨트롤 패드 */
        .control-pad { margin-top: 20px; display: inline-block; }
        .control-row { display: flex; justify-content: center; margin: 5px 0; }
        .btn-dir { width: 50px; height: 50px; margin: 0 5px; background: #333; border: 2px solid #ff9900; color: #ff9900; font-size: 1.2em; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-dir:hover { background: #ff9900; color: #000; }

        .btn-back { display: inline-block; margin-top: 25px; padding: 10px 20px; background: #222; border: 1px solid #888; color: #ccc; text-decoration: none; border-radius: 4px; }
        .btn-back:hover { background: #333; color: #fff; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 style="color: #ff9900; margin: 0 0 5px 0;">{{ stage_info.name }}</h1>
        <p style="color: #aaa; margin: 0 0 20px 0;">{{ stage_info.desc }}</p>

        <div class="status-bar">
            <div style="color: #ff4444;">❤️ HP: <span id="player-hp">{{ user.hp }}</span></div>
            <div style="color: #22ff22;">⚡ 스태미나: <span id="player-stamina">{{ user.stamina }}</span></div>
            <div style="color: #ffff22;">💰: <span id="player-gold">{{ user.gold }}</span>G</div>
            <div class="timer">⏱️ <span id="time-left">{{ time_left }}</span>초</div>
        </div>

        <div class="grid-map" id="game-map">
            </div>

        <div class="control-pad">
            <div class="control-row">
                <button class="btn-dir" onclick="move('UP')">▲</button>
            </div>
            <div class="control-row">
                <button class="btn-dir" onclick="move('LEFT')">◀</button>
                <button class="btn-dir" style="visibility: hidden;"></button>
                <button class="btn-dir" onclick="move('RIGHT')">▶</button>
            </div>
            <div class="control-row">
                <button class="btn-dir" onclick="move('DOWN')">▼</button>
            </div>
        </div>
        <br>
        <a href="/lobby" class="btn-back">로비로 도망치기</a>
    </div>

    <script>
        // 기획안 8번: 서버에서 넘겨준 초기 시간 설정 및 타이머 작동
        let timeLeft = parseInt("{{ time_left }}");
        const timerDisplay = document.getElementById('time-left');
        
        const timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("⏳ 제한시간 초과! 스테이지 공략 실패...");
                location.href = '/lobby';
                return;
            }
            timeLeft--;
            timerDisplay.innerText = timeLeft;
        }, 1000);

        // 기획안 6, 7번: 맵 데이터 및 현재 캐릭터 위치 (기본값 설정, 이후 API 연동)
        const mapData = {{ map_data | tojson }};
        let currentX = {{ current_x }};
        let currentY = {{ current_y }};

        function drawMap() {
            const mapContainer = document.getElementById('game-map');
            mapContainer.innerHTML = '';
            
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const tileEl = document.createElement('div');
                    tileEl.className = 'tile';
                    
                    // 내 캐릭터 위치면 고양이 이모지 표시, 아니면 원래 맵 타일 표시
                    if (r === currentX && c === currentY) {
                        tileEl.classList.add('current');
                        tileEl.innerText = '🐱';
                    } else {
                        tileEl.innerText = mapData[r][c];
                    }
                    mapContainer.appendChild(tileEl);
                }
            }
        }

        // 기획안 7번: 이동 API 요청 (POST /api/move)
        function move(direction) {
            fetch('/api/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ direction: direction, stage: "{{ stage_num }}" })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // 위치 및 스펙 동적 업데이트
                    currentX = data.current_x;
                    currentY = data.current_y;
                    document.getElementById('player-hp').innerText = data.hp;
                    document.getElementById('player-stamina').innerText = data.stamina;
                    document.getElementById('player-gold').innerText = data.gold;
                    drawMap();

                    // 기획안 15번 해결: 메시지가 포함되어 있을 때 팝업 처리
                    if (data.message) {
                        // 텍스트 검증을 엄격하게 하여 단순 설명용 NPC 대사 문자열과 '클리어' 성공 판정을 완벽 분리
                        const isClear = data.message.includes("1단계 클리어") || 
                                        data.message.includes("2단계 클리어") || 
                                        data.message.includes("3단계 클리어");
                        
                        alert(data.message);
                        
                        if (isClear) {
                            location.href = '/lobby';
                        } else if (data.hp <= 1 || data.stamina <= 0) {
                            // 패배 혹은 이동 불가 시 로비 복귀
                            location.href = '/lobby';
                        }
                    }
                } else {
                    alert(data.message); // 이동 실패(벽이나 장애물) 알림
                }
            })
            .catch(err => console.error("이동 에러:", err));
        }

        // 키보드 방향키 조작 이벤트 리스너 연동
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') move('UP');
            if (e.key === 'ArrowDown') move('DOWN');
            if (e.key === 'ArrowLeft') move('LEFT');
            if (e.key === 'ArrowRight') move('RIGHT');
        });

        // 최초 실행 시 맵 그리기
        drawMap();
    </script>
</body>
</html>
